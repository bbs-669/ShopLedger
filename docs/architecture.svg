<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, library modules, configuration, JSON store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.zonehead{font-size:15px;font-weight:700;letter-spacing:.4px}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.cardtitle{font-size:13px;font-weight:700}.body{font-size:12px}.muted{font-size:12px;fill:#475569}
      .edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .edgeAccent{fill:none;stroke:#b45309;stroke-width:2;marker-end:url(#arrowAccent)}
      .invoice{fill:#fff7ed;stroke:#c2410c;stroke-width:2.4}.ticket{fill:#9a3412;font-size:12px;font-weight:700}
      .step{fill:#fff;stroke:#94a3b8;stroke-width:1.2}.stepnum{fill:#1d4ed8}.stepnumtext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
      .flowtitle{font-size:15px;font-weight:700}.legend{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="38" class="title">ShopLedger · application architecture</text>
  <text x="32" y="61" class="subtitle">Browser POS → Express API → routes and shared libraries → JSON file</text>

  <!-- High-level request and storage relationships -->
  <path class="edge" d="M205 211 H229"/>
  <path class="edge" d="M419 211 H439"/>
  <path class="edge" d="M745 238 H765"/>
  <path class="edgeAccent" d="M615 255 C690 255 707 136 765 136"/>

  <!-- Browser UI -->
  <rect x="28" y="91" width="177" height="260" rx="10" class="zone"/>
  <text x="44" y="117" class="zonehead">BROWSER UI</text>
  <rect x="43" y="130" width="147" height="61" rx="6" class="card"/>
  <text x="54" y="152" class="cardtitle">public/index.html</text>
  <text x="54" y="174" class="muted">POS, orders, Khata, audit</text>
  <rect x="43" y="201" width="147" height="67" rx="6" class="card"/>
  <text x="54" y="223" class="cardtitle">public/js/app.js</text>
  <text x="54" y="243" class="muted">XHR, cart preview, order POST</text>
  <text x="54" y="259" class="muted">invoice link and UI updates</text>
  <rect x="43" y="278" width="147" height="52" rx="6" class="card"/>
  <text x="54" y="301" class="cardtitle">public/css/style.css</text>
  <text x="54" y="320" class="muted">page styling</text>

  <!-- Express server -->
  <rect x="229" y="91" width="190" height="260" rx="10" class="zone"/>
  <text x="245" y="117" class="zonehead">EXPRESS SERVER</text>
  <rect x="244" y="130" width="160" height="100" rx="6" class="card"/>
  <text x="256" y="153" class="cardtitle">server.js</text>
  <text x="256" y="174" class="body">bodyParser.json()</text>
  <text x="256" y="192" class="body">static public/ · mounts /api</text>
  <text x="256" y="212" class="body">app.listen(config.port)</text>
  <rect x="244" y="241" width="160" height="91" rx="6" class="invoice"/>
  <text x="256" y="263" class="cardtitle">GET /orders/:id/invoice</text>
  <text x="256" y="283" class="body">orders.get() → invoice.render()</text>
  <text x="256" y="304" class="ticket">highlighted ticket path</text>
  <text x="256" y="322" class="muted">serves printable HTML</text>

  <!-- Routers -->
  <rect x="439" y="91" width="306" height="420" rx="10" class="zone"/>
  <text x="455" y="117" class="zonehead">ROUTES · mounted under /api</text>
  <rect x="454" y="130" width="276" height="84" rx="6" class="card"/>
  <text x="466" y="151" class="cardtitle">routes/products.js</text>
  <text x="466" y="172" class="body">GET /products · GET /coupons</text>
  <text x="466" y="195" class="muted">product list and active coupons</text>
  <rect x="454" y="222" width="276" height="93" rx="6" class="card"/>
  <text x="466" y="243" class="cardtitle">routes/orders.js</text>
  <text x="466" y="264" class="body">GET /orders · GET /orders/:id</text>
  <text x="466" y="283" class="body">POST /orders · POST /orders/:id/cancel</text>
  <text x="466" y="303" class="muted">order creation and cancellation</text>
  <rect x="454" y="323" width="276" height="73" rx="6" class="card"/>
  <text x="466" y="344" class="cardtitle">routes/customers.js</text>
  <text x="466" y="365" class="body">GET /customers · POST /customers/:id/settle</text>
  <text x="466" y="385" class="muted">customer list and settlements</text>
  <rect x="454" y="404" width="276" height="91" rx="6" class="card"/>
  <text x="466" y="425" class="cardtitle">routes/reports.js</text>
  <text x="466" y="446" class="body">GET dashboard · GET GST reconciliation</text>
  <text x="466" y="465" class="body">POST pricing preview · GET admin export</text>
  <text x="466" y="485" class="muted">preview uses pricing and coupon modules</text>

  <!-- Libraries: all lib/ modules present in repository -->
  <rect x="765" y="91" width="407" height="420" rx="10" class="zone"/>
  <text x="781" y="117" class="zonehead">LIBRARIES · lib/</text>
  <rect x="780" y="130" width="184" height="68" rx="6" class="invoice"/>
  <text x="792" y="151" class="cardtitle">lib/invoice.js</text>
  <text x="792" y="171" class="body">computeInvoiceFigures() · render()</text>
  <text x="792" y="189" class="ticket">ticket focus</text>
  <rect x="973" y="130" width="184" height="68" rx="6" class="card"/>
  <text x="985" y="151" class="cardtitle">lib/tax.js</text>
  <text x="985" y="171" class="body">getRateForItem() · GST split</text>
  <text x="985" y="189" class="muted">used by checkout pricing</text>
  <rect x="780" y="207" width="184" height="68" rx="6" class="card"/>
  <text x="792" y="228" class="cardtitle">lib/pricing.js</text>
  <text x="792" y="248" class="body">subtotal() · computeTotals()</text>
  <text x="792" y="266" class="muted">checkout totals</text>
  <rect x="973" y="207" width="184" height="68" rx="6" class="card"/>
  <text x="985" y="228" class="cardtitle">lib/coupons.js</text>
  <text x="985" y="248" class="body">validate() · calculateDiscount()</text>
  <text x="985" y="266" class="muted">coupon rules</text>
  <rect x="780" y="284" width="184" height="68" rx="6" class="card"/>
  <text x="792" y="305" class="cardtitle">lib/inventory.js</text>
  <text x="792" y="325" class="body">find() · check() · reserve()</text>
  <text x="792" y="343" class="muted">stock calculations</text>
  <rect x="973" y="284" width="184" height="68" rx="6" class="card"/>
  <text x="985" y="305" class="cardtitle">lib/orders.js</text>
  <text x="985" y="325" class="body">add() · get() · cancel() · list()</text>
  <text x="985" y="343" class="muted">order records</text>
  <rect x="780" y="361" width="184" height="68" rx="6" class="card"/>
  <text x="792" y="382" class="cardtitle">lib/ledger.js</text>
  <text x="792" y="402" class="body">chargeOrderToKhata()</text>
  <text x="792" y="420" class="muted">customer balances, settlements</text>
  <rect x="973" y="361" width="184" height="68" rx="6" class="card"/>
  <text x="985" y="382" class="cardtitle">lib/store.js</text>
  <text x="985" y="402" class="body">read() · write() · appendAudit()</text>
  <text x="985" y="420" class="muted">JSON persistence</text>
  <rect x="780" y="438" width="184" height="58" rx="6" class="card"/>
  <text x="792" y="459" class="cardtitle">lib/reports.js</text>
  <text x="792" y="480" class="body">getDashboardSummary() · GST reports</text>
  <rect x="973" y="438" width="184" height="58" rx="6" class="card"/>
  <text x="985" y="459" class="cardtitle">lib/dates.js</text>
  <text x="985" y="480" class="body">today() · normalizeDateKey()</text>

  <!-- Configuration and persistence -->
  <rect x="229" y="366" width="190" height="83" rx="9" class="zone"/>
  <text x="245" y="390" class="zonehead">config.js</text>
  <text x="245" y="412" class="body">port · shop · admin key</text>
  <text x="245" y="432" class="body">HSN GST slabs · coupons · inventory defaults</text>
  <rect x="229" y="464" width="190" height="67" rx="9" class="zone"/>
  <text x="245" y="488" class="zonehead">data/db.json</text>
  <text x="245" y="510" class="body">products · orders · customers</text>
  <text x="245" y="527" class="body">settlements · auditLog · IDs · via lib/store.js</text>

  <!-- Checkout dependency callouts -->
  <path class="edge" d="M730 267 C750 267 754 241 780 241"/>
  <path class="edge" d="M964 241 H973"/>
  <path class="edgeAccent" d="M404 286 C560 286 620 164 780 164"/>

  <!-- Numbered placement flow -->
  <text x="32" y="565" class="flowtitle">Order placement · numbered request path</text>
  <path d="M116 655 H1080" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="30" y="585" width="155" height="142" rx="8" class="step"/><circle cx="49" cy="605" r="12" class="stepnum"/><text x="49" y="610" class="stepnumtext">1</text>
    <text x="68" y="609" class="cardtitle">Browser</text><text x="43" y="637" class="body">app.js sends</text><text x="43" y="656" class="body">POST /api/orders</text><text x="43" y="681" class="muted">items, customer,</text><text x="43" y="700" class="muted">payment, coupon</text>
    <rect x="196" y="585" width="155" height="142" rx="8" class="step"/><circle cx="215" cy="605" r="12" class="stepnum"/><text x="215" y="610" class="stepnumtext">2</text>
    <text x="234" y="609" class="cardtitle">Resolve items</text><text x="209" y="637" class="body">routes/orders.js</text><text x="209" y="656" class="body">looks up products</text><text x="209" y="681" class="muted">copies DB price,</text><text x="209" y="700" class="muted">HSN, name, SKU</text>
    <rect x="362" y="585" width="155" height="142" rx="8" class="step"/><circle cx="381" cy="605" r="12" class="stepnum"/><text x="381" y="610" class="stepnumtext">3</text>
    <text x="400" y="609" class="cardtitle">Stock + subtotal</text><text x="375" y="637" class="body">inventory.check()</text><text x="375" y="656" class="body">pricing.subtotal()</text><text x="375" y="681" class="muted">rejects unavailable</text><text x="375" y="700" class="muted">stock</text>
    <rect x="528" y="585" width="155" height="142" rx="8" class="step"/><circle cx="547" cy="605" r="12" class="stepnum"/><text x="547" y="610" class="stepnumtext">4</text>
    <text x="566" y="609" class="cardtitle">Coupon + totals</text><text x="541" y="637" class="body">coupons.validate()</text><text x="541" y="656" class="body">pricing.computeTotals()</text><text x="541" y="681" class="muted">tax.getRateForItem()</text><text x="541" y="700" class="muted">HSN GST and total</text>
    <rect x="694" y="585" width="155" height="142" rx="8" class="step"/><circle cx="713" cy="605" r="12" class="stepnum"/><text x="713" y="610" class="stepnumtext">5</text>
    <text x="732" y="609" class="cardtitle">Khata + stock</text><text x="707" y="637" class="body">ledger.</text><text x="707" y="656" class="body">chargeOrderToKhata()</text><text x="707" y="681" class="muted">inventory.reserve()</text><text x="707" y="700" class="muted">for every order</text>
    <rect x="860" y="585" width="155" height="142" rx="8" class="step"/><circle cx="879" cy="605" r="12" class="stepnum"/><text x="879" y="610" class="stepnumtext">6</text>
    <text x="898" y="609" class="cardtitle">Build record</text><text x="873" y="637" class="body">orders.add()</text><text x="873" y="656" class="body">store.appendAudit()</text><text x="873" y="681" class="muted">assign ID and</text><text x="873" y="700" class="muted">append order</text>
    <rect x="1026" y="585" width="155" height="142" rx="8" class="step"/><circle cx="1045" cy="605" r="12" class="stepnum"/><text x="1045" y="610" class="stepnumtext">7</text>
    <text x="1064" y="609" class="cardtitle">Persist</text><text x="1039" y="637" class="body">store.write()</text><text x="1039" y="656" class="body">updates db.json</text><text x="1039" y="681" class="muted">return 201 + order</text><text x="1039" y="700" class="muted">to the browser</text>
  </g>

  <!-- Legend -->
  <line x1="32" y1="762" x2="74" y2="762" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="83" y="766" class="legend">request / data direction</text>
  <rect x="275" y="750" width="22" height="20" rx="3" class="invoice"/>
  <text x="306" y="766" class="legend">ticket focus: invoice rendering path</text>
  <text x="1168" y="766" text-anchor="end" class="muted">All labels verified against repository files</text>
</svg>
